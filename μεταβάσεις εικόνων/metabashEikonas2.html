<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Season Transition — click to change</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #333;
  }

  #three-container { position: fixed; inset: 0; }

  canvas {
    display: block;
    background-image: radial-gradient(#666, #333);
  }

  #instructions {
    position: absolute;
    color: #fff;
    bottom: 0;
    padding-bottom: 6px;
    font-family: sans-serif;
    width: 100%;
    text-align: center;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>

<div id="three-container"></div>
<div id="instructions">Κάνε κλικ για αλλαγή εποχής</div>

<!-- Η μόνη εξωτερική εξάρτηση που έμεινε: three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. CONFIG
   ============================================================ */

const WIDTH           = 100;
const HEIGHT          = 60;
const TRANSITION_TIME = 3.0;   // δευτερόλεπτα για ένα πλήρες transition

const IMAGE_OUT = 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/175711/winter.jpg';
const IMAGE_IN  = 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/175711/spring.jpg';

/* ============================================================
   2. HELPERS  (αντικαθιστούν τα THREE.Math.* και το utils)
   ============================================================ */

const randFloat  = (min, max) => min + Math.random() * (max - min);
const randSpread = (range)    => range * (0.5 - Math.random()); // [-range/2, range/2]
const clamp      = (v, a, b)  => Math.min(b, Math.max(a, v));
const mapLinear  = (x, a1, a2, b1, b2) => b1 + ((x - a1) * (b2 - b1)) / (a2 - a1);

/* ============================================================
   3. SHADERS
   (αντικαθιστούν το THREE.BAS.BasicAnimationMaterial + ShaderChunks)
   ============================================================ */

const VERTEX_HEAD = `
  uniform float uTime;

  attribute vec2 aAnimation;     // x = delay, y = duration
  attribute vec3 aStartPosition;
  attribute vec3 aControl0;
  attribute vec3 aControl1;
  attribute vec3 aEndPosition;

  varying vec2 vUv;

  vec3 cubicBezier(vec3 p0, vec3 c0, vec3 c1, vec3 p1, float t) {
    float tn = 1.0 - t;
    return tn * tn * tn * p0
         + 3.0 * tn * tn * t * c0
         + 3.0 * tn * t * t * c1
         + t * t * t * p1;
  }

  float easeInOutCubic(float t) {
    return t < 0.5
      ? 4.0 * t * t * t
      : 1.0 - pow(-2.0 * t + 2.0, 3.0) * 0.5;
  }
`;

function makeVertexShader(phase) {
  // 'out' -> το πλακίδιο συρρικνώνεται προς το κέντρο του
  // 'in'  -> το πλακίδιο ξεκινά από το κέντρο και ανοίγει
  const scaleLine = phase === 'in'
    ? 'transformed *= tProgress;'
    : 'transformed *= 1.0 - tProgress;';

  return VERTEX_HEAD + `
  void main() {
    vUv = uv;

    float tDelay    = aAnimation.x;
    float tDuration = aAnimation.y;
    float tTime     = clamp(uTime - tDelay, 0.0, tDuration);
    float tProgress = easeInOutCubic(tTime / tDuration);

    vec3 transformed = position;
    ${scaleLine}
    transformed += cubicBezier(aStartPosition, aControl0, aControl1, aEndPosition, tProgress);

    gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
  }
  `;
}

const FRAGMENT_SHADER = `
  uniform sampler2D uMap;
  varying vec2 vUv;

  void main() {
    gl_FragColor = texture2D(uMap, vUv);
  }
`;

/* ============================================================
   4. GEOMETRY BUILDER
   (αντικαθιστά τα THREE.BAS.Utils.separateFaces / ModelBufferGeometry)
   ============================================================ */

function buildSlideGeometry(width, height, phase) {
  // Πυκνό πλέγμα -> μη-indexed, ώστε κάθε τρίγωνο να έχει δικά του vertices
  const plane = new THREE.PlaneGeometry(width, height, width * 2, height * 2);
  const geo   = plane.toNonIndexed();
  plane.dispose();

  geo.deleteAttribute('normal'); // δεν το χρειαζόμαστε

  const src         = geo.attributes.position.array;
  const vertexCount = geo.attributes.position.count;
  const faceCount   = vertexCount / 3;

  const positions  = new Float32Array(vertexCount * 3);
  const aAnimation = new Float32Array(vertexCount * 2);
  const aStart     = new Float32Array(vertexCount * 3);
  const aControl0  = new Float32Array(vertexCount * 3);
  const aControl1  = new Float32Array(vertexCount * 3);
  const aEnd       = new Float32Array(vertexCount * 3);

  const MIN_DURATION = 0.8;
  const MAX_DURATION = 1.2;
  const MAX_DELAY_X  = 0.9;
  const MAX_DELAY_Y  = 0.125;
  const STRETCH      = 0.11;

  const totalDuration = MAX_DURATION + MAX_DELAY_X + MAX_DELAY_Y + STRETCH;

  const dir = phase === 'in' ? -1 : 1;

  for (let f = 0; f < faceCount; f++) {
    const o = f * 9;

    const ax = src[o],     ay = src[o + 1], az = src[o + 2];
    const bx = src[o + 3], by = src[o + 4], bz = src[o + 5];
    const cx = src[o + 6], cy = src[o + 7], cz = src[o + 8];

    // centroid του τριγώνου
    const mx = (ax + bx + cx) / 3;
    const my = (ay + by + cy) / 3;
    const mz = (az + bz + cz) / 3;

    // --- animation timing ---
    const duration = randFloat(MIN_DURATION, MAX_DURATION);
    const delayX   = mapLinear(mx, -width * 0.5, width * 0.5, 0.0, MAX_DELAY_X);
    const delayY   = phase === 'in'
      ? mapLinear(Math.abs(my), 0, height * 0.5, 0.0, MAX_DELAY_Y)
      : mapLinear(Math.abs(my), 0, height * 0.5, MAX_DELAY_Y, 0.0);

    // --- control points (cubic bezier) ---
    const signY = Math.sign(my);

    const c0x = mx + dir * randFloat(0.1, 0.3) * 50;
    const c0y = my + dir * signY * randFloat(0.1, 0.3) * 70;
    const c0z = mz + dir * randSpread(20);

    const c1x = mx + dir * randFloat(0.3, 0.6) * 50;
    const c1y = my - dir * signY * randFloat(0.3, 0.6) * 70;
    const c1z = mz + dir * randSpread(20);

    const animDelay = delayX + delayY;

    for (let v = 0; v < 3; v++) {
      const vo = o + v * 3;
      const vi = f * 3 + v;

      // θέση ως προς το centroid
      positions[vo]     = src[vo]     - mx;
      positions[vo + 1] = src[vo + 1] - my;
      positions[vo + 2] = src[vo + 2] - mz;

      aAnimation[vi * 2]     = animDelay + Math.random() * STRETCH * duration;
      aAnimation[vi * 2 + 1] = duration;

      aStart[vi * 3]     = mx; aStart[vi * 3 + 1] = my; aStart[vi * 3 + 2] = mz;
      aEnd[vi * 3]       = mx; aEnd[vi * 3 + 1]   = my; aEnd[vi * 3 + 2]   = mz;

      aControl0[vi * 3]     = c0x; aControl0[vi * 3 + 1] = c0y; aControl0[vi * 3 + 2] = c0z;
      aControl1[vi * 3]     = c1x; aControl1[vi * 3 + 1] = c1y; aControl1[vi * 3 + 2] = c1z;
    }
  }

  geo.setAttribute('position',     new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aAnimation',   new THREE.BufferAttribute(aAnimation, 2));
  geo.setAttribute('aStartPosition', new THREE.BufferAttribute(aStart, 3));
  geo.setAttribute('aControl0',    new THREE.BufferAttribute(aControl0, 3));
  geo.setAttribute('aControl1',    new THREE.BufferAttribute(aControl1, 3));
  geo.setAttribute('aEndPosition', new THREE.BufferAttribute(aEnd, 3));

  return { geometry: geo, totalDuration };
}

/* ============================================================
   5. SLIDE
   ============================================================ */

class Slide extends THREE.Mesh {
  constructor(width, height, phase, texture) {
    const { geometry, totalDuration } = buildSlideGeometry(width, height, phase);

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMap:  { value: texture }
      },
      vertexShader:   makeVertexShader(phase),
      fragmentShader: FRAGMENT_SHADER,
      side: THREE.DoubleSide
    });

    super(geometry, material);

    this.frustumCulled  = false;
    this.totalDuration  = totalDuration;
  }

  get time() { return this.material.uniforms.uTime.value; }
  set time(v) { this.material.uniforms.uTime.value = v; }
}

/* ============================================================
   6. MAIN
   ============================================================ */

const container = document.getElementById('three-container');

/* --- renderer --- */
const renderer = new THREE.WebGLRenderer({
  antialias: window.devicePixelRatio === 1,
  alpha: true
});
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

/* --- camera / scene --- */
const camera = new THREE.PerspectiveCamera(
  80,
  window.innerWidth / window.innerHeight,
  10,
  2000
);
camera.position.set(0, 0, 60);

const scene = new THREE.Scene();

/* --- textures --- */
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const texOut = loader.load(IMAGE_OUT);
const texIn  = loader.load(IMAGE_IN);

/* --- slides --- */
const slideOut = new Slide(WIDTH, HEIGHT, 'out', texOut); // φεύγει
const slideIn  = new Slide(WIDTH, HEIGHT, 'in',  texIn);  // έρχεται

scene.add(slideOut);
scene.add(slideIn);

/* --- state: 0 = πρώτη εικόνα, 1 = δεύτερη εικόνα --- */
let progress = 0;   // πραγματική θέση 0..1
let target   = 0;   // που πάμε

function applyProgress() {
  slideOut.time = progress * slideOut.totalDuration;
  slideIn.time  = progress * slideIn.totalDuration;
}
applyProgress();

/* --- click: αλλάζει κατεύθυνση --- */
document.body.style.cursor = 'pointer';

window.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  target = target === 0 ? 1 : 0;
});

/* --- loop --- */
const clock = new THREE.Clock();

function tick() {
  const dt   = Math.min(clock.getDelta(), 0.05);
  const step = dt / TRANSITION_TIME;

  if (progress < target) {
    progress = Math.min(target, progress + step);
  } else if (progress > target) {
    progress = Math.max(target, progress - step);
  }

  applyProgress();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* --- resize --- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

tick();
</script>
</body>
</html>
