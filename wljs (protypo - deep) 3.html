<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Glass Context Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Asap:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* vars */
            --hue1: 255;
            --hue2: 222;
            --border: 1px;
            --border-color: hsl(var(--hue2), 12%, 20%);
            --radius: 22px;
            --ease: cubic-bezier(0.5, 1, 0.89, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Asap', sans-serif;
            background: #08090d;
            background-image: url(https://assets.codepen.io/13471/abstract-light.jpg), linear-gradient(to right in oklab, hsl(var(--hue2) 50% 75%), hsl(var(--hue1) 50% 75%));
            background-size: cover;
            background-position: center;
            background-blend-mode: hard-light;
            padding: 0;
            min-height: 100svh;
            overflow-x: hidden;
            color: #fff;
        }

        #app {
            min-height: 100svh;
            padding: 2svw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #app > header {
            display: flex;
            gap: 0.5em;
            flex-direction: column;
            margin-top: 2rem;
        }

        #app > header h1,
        #app > header p {
            margin: 0;
            color: color-mix(in oklab, var(--fg) 70%, hsl(var(--hue1) 50% 50%));
        }

        #app > header h1 {
            font-size: 2.5rem;
            font-weight: 400;
        }

        #app > header p {
            font-size: 1.2rem;
            color: color-mix(in oklab, var(--fg) 40%, hsl(var(--hue2) 50% 50%));
        }

        #app > footer {
            align-self: end;
            max-width: calc(96svw - 200px);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #app > footer h2 {
            width: 100%;
            font-size: 1em;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        #app > footer [type=range] {
            --tint: hsl( var(--hue2) 66% 50% );
            --tint2: hsl( var(--hue1) 66% 50% );
            width: 320px;
            margin: 0;
        }

        #app > footer #h1 {
            --tint: hsl( var(--hue1) 66% 50% );
            --tint2: hsl( var(--hue1) 66% 50% );
            --hue: var(--hue1);
            width: 320px;
        }

        #app > footer #h2 {
            --tint: hsl( var(--hue2) 66% 50% );
            --tint2: hsl( var(--hue2) 66% 50% );
            --hue: var(--hue2);
            width: 320px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--tint);
            cursor: pointer;
            box-shadow: 0 1px 2px 1px hsl(var(--hue) 66% 20% / 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--tint);
            cursor: pointer;
            box-shadow: 0 1px 2px 1px hsl(var(--hue) 66% 20% / 0.5);
            border: none;
        }

        @media screen and (max-width: 480px) {
            #app > footer {
                gap: 1em;
            }
        }

        #menu {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition-property: visibility, opacity, filter;
            transition-duration: 0s, 0.25s, 0.25s;
            transition-delay: 0.5s, 0s, 0s;
            transition-timing-function: var(--ease);
            filter: blur(4px);
            font-family: 'Asap', sans-serif;
            color: #737985;
            position: fixed;
            top: 140px;
            left: 2svw;
            min-width: 275px;
            min-height: 275px;
            border-radius: var(--radius);
            border: var(--border) solid var(--border-color);
            padding: 1em;
            background: linear-gradient(235deg, hsl(var(--hue1) 50% 10% / 0.8), hsl(var(--hue1) 50% 10% / 0) 33%), linear-gradient(45deg , hsl(var(--hue2) 50% 10% / 0.8), hsl(var(--hue2) 50% 10% / 0) 33%), linear-gradient(hsl(220deg 25% 4.8% / 0.66));
            backdrop-filter: blur(12px);
            box-shadow: hsl(var(--hue2) 50% 2%) 0px 10px 16px -8px, hsl(var(--hue2) 50% 4%) 0px 20px 36px -14px;
            z-index: 1000;
        }

        #menu:not(.open)::before,
        #menu:not(.open)::after,
        #menu:not(.open) .glow {
            opacity: 0;
            pointer-events: none;
            animation: glowoff 0.25s var(--ease) both;
        }

        #menu.open {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            transition-delay: 0s;
            filter: blur(0px); 
        }

        #menu.open::before,
        #menu.open::after,
        #menu.open .glow,
        #menu.open .shine {
            animation: glow 1s var(--ease) both;
        }

        #menu.open .shine {
            animation-delay: 0s;
            animation-duration: 2s;
        }

        #menu.open .glow {
            animation-delay: 0.2s;
        }

        #menu.open .glow-bright {
            animation-delay: 0.1s;
            animation-duration: 1.5s;
        }

        #menu.open .shine-bottom {
            animation-delay: 0.1s;
            animation-duration: 1.8s;
        }

        #menu.open .glow-bottom {
            animation-delay: 0.3s;
        }

        #menu.open .glow-bright.glow-bottom {
            animation-delay: 0.3s;
            animation-duration: 1.1s;
        }

        #menu .shine,
        #menu .glow {
            --hue: var(--hue1);
        }

        #menu .shine-bottom,
        #menu .glow-bottom {
            --hue: var(--hue2);
            --conic: 135deg;
        }

        #menu .shine,
        #menu .shine::before,
        #menu .shine::after {
            pointer-events: none;
            border-radius: 0;
            border-top-right-radius: inherit;
            border-bottom-left-radius: inherit;
            border: 1px solid transparent;
            width: 75%;
            height: auto;
            min-height: 0px;
            aspect-ratio: 1;
            display: block;
            position: absolute;
            right: calc(var(--border) * -1);
            top: calc(var(--border) * -1);
            left: auto;
            z-index: 1;
            --start: 12%;
            background: conic-gradient(
                from var(--conic, -45deg) at center in oklch,
                transparent var(--start,0%), hsl( var(--hue), var(--sat,80%), var(--lit,60%)), transparent  var(--end,50%) 
            ) border-box;
            mask: 
                linear-gradient(transparent), 
                linear-gradient(black);
            mask-repeat: no-repeat;
            mask-clip: padding-box, border-box;
            mask-composite: subtract;
        }

        #menu .shine::before,
        #menu .shine::after {
            content: "";
            width: auto;
            inset: -2px;
            mask: none;
        }

        #menu .shine::after { 
            z-index: 2;
            --start: 17%;
            --end: 33%;
            background: conic-gradient(
                from var(--conic, -45deg) at center in oklch,
                transparent var(--start,0%), hsl( var(--hue), var(--sat,80%), var(--lit,85%)), transparent var(--end,50%) 
            );
        }

        #menu .shine-bottom {
            top: auto;
            bottom: calc(var(--border) * -1);
            left: calc(var(--border) * -1);
            right: auto;
        }

        #menu .glow {
            pointer-events: none;
            border-top-right-radius: calc(var(--radius) * 2.5);
            border-bottom-left-radius: calc(var(--radius) * 2.5);
            border: calc(var(--radius) * 1.25) solid transparent;
            inset: calc(var(--radius) * -2);
            width: 75%;
            height: auto;
            min-height: 0px;
            aspect-ratio: 1;
            display: block;
            position: absolute;
            left: auto;
            bottom: auto;
            mask: url('https://assets.codepen.io/13471/noise-base.png');
            mask-mode: luminance;
            mask-size: 29%;
            opacity: 1;
            filter: blur(12px) saturate(1.25) brightness(0.5);
            mix-blend-mode: plus-lighter;
            z-index: 3;
        }

        #menu .glow.glow-bottom {
            inset: calc(var(--radius) * -2);
            top: auto;
            right: auto;
        }

        #menu .glow::before, 
        #menu .glow::after {
            content: "";
            position: absolute;
            inset: 0;
            border: inherit;
            border-radius: inherit;
            background: conic-gradient(
                from var(--conic, -45deg) at center in oklch,
                transparent var(--start,0%), hsl( var(--hue), var(--sat,95%), var(--lit,60%)), transparent  var(--end,50%) 
            ) border-box;
            mask: 
                linear-gradient(transparent), 
                linear-gradient(black);
            mask-repeat: no-repeat;
            mask-clip: padding-box, border-box;
            mask-composite: subtract;
            filter: saturate(2) brightness(1);
        }

        #menu .glow::after {
            --lit: 70%;
            --sat: 100%;
            --start: 15%;
            --end: 35%;
            border-width: calc(var(--radius) * 1.75);
            border-radius: calc(var(--radius) * 2.75);
            inset: calc(var(--radius) * -0.25);
            z-index: 4;
            opacity: 0.75;
        }

        #menu .glow-bright {
            --lit: 80%;
            --sat: 100%;
            --start: 13%;
            --end: 37%;
            border-width: 5px;
            border-radius: calc(var(--radius) + 2px);
            inset: -7px;
            left: auto;
            filter: blur(2px) brightness(0.66);
        }

        #menu .glow-bright::after {
            content: none;
        }

        #menu .glow-bright.glow-bottom {
            inset: -7px;
            right: auto;
            top: auto;
        }

        #menu .inner,
        #menu section {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }

        #menu .inner {
            font-size: 0.875rem;
        }

        #menu hr {
            width: 100%;
            height: 0.5px;
            background: var(--border-color);
            border: none;
            margin: 0.25em 0 0.5em;
            opacity: 0.66;
        }

        #menu input {
            --tint2: hsl(var(--hue2) 50% 90% / 0.1);
            font-family: 'Asap', sans-serif;
            font-weight: 300;
            box-shadow: 0 0 0 1px transparent;
            border: 1px solid hsl(var(--hue2) 13% 18.5% / 0.5);
            background: hsl(var(--hue1) 0% 40% / 0.05);
            border-radius: calc(var(--radius) * 0.33333);
            padding: 0.5em 0.5em 0.5em 2.33em;
            color: #fff;
            outline: none;
        }

        #menu input::placeholder {
            color: #737985;
        }

        #menu label {
            display: grid;
            grid-template: 1fr/auto 1fr;
            margin-bottom: 1em;
            width: 100%;
            position: relative;
        }
        
        #menu label > * {
            grid-row: 1;
            align-self: center;
        }

        #menu label input {
            grid-column: 1 / -1;
        }

        #menu label #searchButton {
            grid-column: 1;
            margin-left: 0.5em;
            opacity: 0.5;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 10;
        }
        
        #menu label #searchButton svg {
             width: 100%;
             height: 100%;
             color: #737985;
        }


        #menu header {
            font-size: 0.75rem;
            font-weight: 300;
            padding: 0 0.66em;
        }

        #menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #menu li {
            position: relative;
            padding: 0.66em;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 0.5em;
            border-radius: calc(var(--radius) * 0.33333);
            border: 1px solid transparent;
            transition: all 0.3s ease-in, --item-opacity 0.3s ease-in;
            background: 
                linear-gradient(
                    90deg  in oklch, 
                    hsl(var(--hue1) 29% 13% / var(--item-opacity)),
                    hsl(var(--hue1) 30% 15% / var(--item-opacity)) 24% 32%, 
                    hsl(var(--hue1) 5% 7% / var(--item-opacity))
                ) border-box;
            cursor: pointer;
        }

        #menu li::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: inherit;
            background: 
                linear-gradient(
                    90deg  in oklch, 
                    hsl(var(--hue1) 15% 16% / var(--item-opacity)),
                    hsl(var(--hue1) 40% 24% / var(--item-opacity)) 20% 32%, 
                    hsl(var(--hue1) 2% 12% / var(--item-opacity))
                ) border-box;
            mask: 
                linear-gradient(transparent), 
                linear-gradient(black);
            mask-repeat: no-repeat;
            mask-clip: padding-box, border-box;
            mask-composite: subtract;
        }

        #menu li:hover,
        #menu li.selected,
        #menu li:hover::after,
        #menu li.selected::after {
            --item-opacity: 0.5;
            transition: all 0.1s ease-out, --item-opacity 0.1s ease-out;
            color: white;
        }

        #menu li.selected,
        #menu li.selected::after {
            animation: flash 0.75s ease-out 1 forwards;
        }

        @property --item-opacity {
            syntax: "<number>";
            inherits: false;
            initial-value: 0;
        }

        #menu svg {
            fill: none;
            stroke-width: 1;
            height: 20px;
            stroke: currentColor;
        }

        /* Στυλ για υπομενού */
        .submenu {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            min-width: 250px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: var(--radius);
            border: var(--border) solid var(--border-color);
            padding: 1em;
            background: linear-gradient(235deg, hsl(var(--hue1) 50% 10% / 0.8), hsl(var(--hue1) 50% 10% / 0) 33%), linear-gradient(45deg , hsl(var(--hue2) 50% 10% / 0.8), hsl(var(--hue2) 50% 10% / 0) 33%), linear-gradient(hsl(220deg 25% 4.8% / 0.66));
            backdrop-filter: blur(12px);
            box-shadow: hsl(var(--hue2) 50% 2%) 0px 10px 16px -8px, hsl(var(--hue2) 50% 4%) 0px 20px 36px -14px;
            z-index: 1001;
        }

        #menu li.has-submenu:hover > .submenu {
            display: block;
        }

        /* Στυλ για scrollbar στο υπομενού */
        .submenu::-webkit-scrollbar {
            width: 8px;
        }

        .submenu::-webkit-scrollbar-track {
            background: transparent;
        }

        .submenu::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .submenu::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Βέλος για υπομενού */
        #menu li.has-submenu > .arrow::after, li.has-submenu::after {
            content: "›";
            position: absolute;
            right: 10px;
            font-size: 1.2em;
        }
        
        .social-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.6);
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
        }
        
        /* ΝΕΟ CSS ΓΙΑ ΤΟ POP-UP ΑΠΟΤΕΛΕΣΜΑΤΩΝ */
        #searchResultsModal {
            display: none; /* Κρυφό από προεπιλογή */
            position: fixed;
            z-index: 1002;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            color: #fff;
            border-radius: var(--radius);
            border: var(--border) solid var(--border-color);
            padding: 1.5em;
            background: linear-gradient(235deg, hsl(var(--hue1) 50% 10% / 0.8), hsl(var(--hue1) 50% 10% / 0) 33%), linear-gradient(45deg, hsl(var(--hue2) 50% 10% / 0.8), hsl(var(--hue2) 50% 10% / 0) 33%), linear-gradient(hsl(220deg 25% 4.8% / 0.75));
            backdrop-filter: blur(15px);
            box-shadow: hsl(var(--hue2) 50% 2%) 0px 10px 16px -8px, hsl(var(--hue2) 50% 4%) 0px 20px 36px -14px;
        }

        #searchResultsModal h2 {
            font-size: 1.2rem;
            margin-bottom: 1em;
            font-weight: 400;
            color: #eee;
        }
        
        #searchResultsList {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #searchResultsList li {
            padding: 0.75em;
            border-radius: 6px;
            transition: background-color 0.2s ease-in-out;
        }
        
        #searchResultsList li a {
            color: #ccc;
            text-decoration: none;
            display: block;
        }

        #searchResultsList li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        #searchResultsList li:hover a {
             color: #fff;
        }
        
        #closeModalButton {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 5px;
        }
        
        /* Scrollbar για τα αποτελέσματα, παρόμοιο με το submenu */
        #searchResultsList::-webkit-scrollbar {
            width: 8px;
        }
        #searchResultsList::-webkit-scrollbar-track {
            background: transparent;
        }
        #searchResultsList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }


        @keyframes glow {
            0% {
                opacity: 0;
            }
            3% {
                opacity: 1;
            }
            10% {
                opacity: 0;
            }
            12% {
                opacity: 0.7;
            }
            16% {
                opacity: 0.3;
                animation-timing-function: var(--ease);
            }
            100% {
                opacity: 1;
                animation-timing-function: var(--ease);
            }
        }

        @keyframes glowoff {
            to {
                opacity: 0;
            }
        }

        @keyframes flash {
            0% {
                opacity: 0;
                --item-opacity: 0;
            }
            7% {
                opacity: 0.5;
                --item-opacity: 1;
            }
            14% {
                opacity: 0;
                --item-opacity: 0.5;
            }
            21%, 100% {
                opacity: 1;
                --item-opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main id="app">
        <header>
            <h1>Neon Glass Context menu</h1>
            <p>Right-click to open</p>
        </header>
        
        <footer class="dark">
            <h2>Pick your own colors!</h2>
            <input type="range" id="h1" min="0" max="360" value="255">
            <input type="range" id="h2" min="0" max="360" value="222">
        </footer>
    </main>

    <aside id="menu" class="open dark">
        <span class="shine shine-top"></span>
        <span class="shine shine-bottom"></span>
        <span class="glow glow-top"></span>
        <span class="glow glow-bottom"></span>
        <span class="glow glow-bright glow-top "></span>
        <span class="glow glow-bright glow-bottom "></span>
        
        <div class="inner">
            
            <label>
                 <button id="searchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                 </button>
                <input type="text" id="searchInput" placeholder="type a command or search">
            </label>
            
            <section>
                <header>Suggestions</header>
                <ul>
                    <li class="selected has-submenu">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                        </svg> 
                        <span class="arrow">Calendar</span>
                        <ul class="submenu">
                            <li data-href="day-view.htm" data-keywords="day daily view ημερήσια">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" /></svg>
                                Day View

    <div id="searchResultsModal">
        <button id="closeModalButton">&times;</button>
        <h2>Search Results</h2>
        <ul id="searchResultsList">
            </ul>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const searchModal = document.getElementById('searchResultsModal');
            const resultsList = document.getElementById('searchResultsList');
            const closeModalButton = document.getElementById('closeModalButton');

            const performSearch = () => {
                const query = searchInput.value.trim().toLowerCase();
                if (query === '') {
                    return; // Μην κάνεις τίποτα αν η αναζήτηση είναι κενή
                }

                resultsList.innerHTML = ''; // Καθάρισε τα προηγούμενα αποτελέσματα
                const allLinks = document.querySelectorAll('li[data-keywords]');
                let foundResults = false;

                allLinks.forEach(link => {
                    const keywords = link.dataset.keywords.toLowerCase();
                    const linkText = link.innerText;
                    const linkHref = link.dataset.href;

                    if (keywords.includes(query) || linkText.toLowerCase().includes(query)) {
                        foundResults = true;
                        const listItem = document.createElement('li');
                        const anchor = document.createElement('a');
                        anchor.href = linkHref || '#';
                        anchor.textContent = linkText;
                        listItem.appendChild(anchor);
                        resultsList.appendChild(listItem);
                    }
                });

                if (!foundResults) {
                    resultsList.innerHTML = '<li>Δεν βρέθηκαν αποτελέσματα.</li>';
                }

                searchModal.style.display = 'block'; // Εμφάνισε το pop-up
            };

            // Event Listeners
            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });

            closeModalButton.addEventListener('click', () => {
                searchModal.style.display = 'none'; // Κλείσε το pop-up
            });

            // Κλείσιμο του pop-up αν ο χρήστης κλικάρει έξω από αυτό
            window.addEventListener('click', (event) => {
                if (event.target === searchModal) {
                    searchModal.style.display = 'none';
                }
            });

            // Handle link clicks inside the menu
            document.querySelectorAll('#menu li[data-href]').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent parent handlers from firing
                    const href = item.getAttribute('data-href');
                    if (href) {
                        window.location.href = href;
                    }
                });
            });
        });
    </script>
